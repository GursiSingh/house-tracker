name: House Tracker — weekly discovery and update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 0"
      timezone: "Europe/London"

permissions:
  contents: write

concurrency:
  group: house-tracker-update
  cancel-in-progress: false

jobs:
  update-house-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tracked listing sources and price history
        run: python scripts/update_property_sources.py

      - name: Discover new property candidates
        run: python scripts/discover_properties.py

      - name: Audit public repository data
        run: python scripts/audit_public_data.py

      - name: Commit weekly tracker results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add properties.json data/update_history.json data/discovery_history.json
          if git diff --cached --quiet; then
            echo "No tracker changes to commit."
          else
            git commit -m "chore: weekly house tracker discovery and source checks"
            git push
          fi
