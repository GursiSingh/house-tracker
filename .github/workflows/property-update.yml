name: House Tracker — scheduled update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 0"
      timezone: "Europe/London"

permissions:
  contents: write

concurrency:
  group: house-tracker-update
  cancel-in-progress: false

jobs:
  update-property-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tracked listing sources
        run: python scripts/update_property_sources.py

      - name: Commit source-check results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add properties.json data/update_history.json
          if git diff --cached --quiet; then
            echo "No source-check changes to commit."
          else
            git commit -m "chore: update house tracker source checks"
            git push
          fi
